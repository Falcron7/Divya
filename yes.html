<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I was hoping you'd say that</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>

body{

  background: linear-gradient(180deg,#ff6b81,#ffd166);

  font-family: 'Poppins', sans-serif;

  color: white;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  height: 100vh;

  overflow: hidden;

  text-align: center;

}

h1{

  font-size: 56px;

  animation: pop 1s ease forwards;

}

@keyframes pop {

  0%{transform: scale(0);}

  80%{transform: scale(1.1);}

  100%{transform: scale(1);}

}

.heart{

  position: absolute;

  font-size: 24px;

  animation: float 5s linear infinite;

}

@keyframes float {

  from{transform: translateY(0); opacity:1;}

  to{transform: translateY(-800px); opacity:0;}

}

</style>

</head>

<body>

  <h1>I really value the connection we share</h1>

  <h4>I’m not the kind of person who says this easily, but you deserve to hear it. <h4>

    <p>💕</p>

  <p>
    Are you ready to go on a BALL
  </p>

    <footer>

  <p>© 2026 Made with 💕 by Raghav Gandhi</p>

</footer>



  



<script>

function createHeart(){

  const heart = document.createElement('div');

  heart.classList.add('heart');

  heart.innerText = ['❤️','💖','💕','💘','💞'][Math.floor(Math.random()*5)];

  heart.style.left = Math.random() * 100 + 'vw';

  heart.style.animationDuration = (3 + Math.random()*3) + 's';

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),5000);

}

setInterval(createHeart,200);

</script>

</body>

</html>
